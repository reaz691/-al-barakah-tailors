<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2b">
<meta name="description" content="Al-Barakah Tailors Tailoring Management">
<link rel="manifest" href="manifest.webmanifest">
<title>আল-বারাকাহ টেইলার্স</title>

<style>
:root{
 --bg:#f5f7f6;
 --card:#fff;
 --ink:#17302a;
 --muted:#6b7772;
 --brand:#173b2b;
 --accent:#c89b3c;
 --danger:#b42318;
 --line:#e4e9e6
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Bengali",
 "Noto Sans",sans-serif;
 background:var(--bg);
 color:var(--ink);
 padding-bottom:82px
}

header{
 background:linear-gradient(135deg,#173b2b,#245844);
 color:#fff;
 padding:20px 18px 24px;
 border-radius:0 0 24px 24px
}

.brand{
 display:flex;
 gap:12px;
 align-items:center
}

.logo{
 width:52px;
 height:52px;
 border-radius:14px;
 background:#fff2;
 border:1px solid #ffffff44;
 display:grid;
 place-items:center;
 font-size:24px
}

.brand h1{
 font-size:19px;
 margin:0
}

.brand p{
 margin:3px 0 0;
 color:#dce9e2;
 font-size:12px
}

main{
 padding:16px;
 max-width:760px;
 margin:auto
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 10px
}

.section-title h2{
 font-size:17px;
 margin:0
}

.muted{
 color:var(--muted);
 font-size:13px
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 box-shadow:0 2px 10px #173b2b08
}

.stat b{
 font-size:24px;
 display:block
}

.stat span{
 font-size:12px;
 color:var(--muted)
}

.actions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.btn{
 border:0;
 border-radius:14px;
 padding:13px 12px;
 font-size:14px;
 font-weight:650;
 background:var(--brand);
 color:white
}

.btn.secondary{
 background:#eaf0ed;
 color:var(--brand)
}

.btn.gold{
 background:var(--accent);
 color:#fff
}

.btn.danger{
 background:#fff0ee;
 color:var(--danger)
}

.list{
 display:flex;
 flex-direction:column;
 gap:9px
}

.row{
 display:flex;
 justify-content:space-between;
 gap:12px;
 align-items:center
}

.order-title{
 font-weight:700
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:999px;
 background:#edf5f0;
 font-size:11px;
 color:var(--brand)
}

.badge.warn{
 background:#fff4db;
 color:#8a5b00
}

.badge.danger{
 background:#ffebe9;
 color:var(--danger)
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#fff;
 border-top:1px solid var(--line);
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:8px max(8px,env(safe-area-inset-left))
 calc(8px + env(safe-area-inset-bottom));
 z-index:5
}

.nav{
 border:0;
 background:none;
 color:#68736f;
 font-size:11px
}

.nav.active{
 color:var(--brand);
 font-weight:700
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #d9e1dd;
 border-radius:12px;
 background:#fff;
 font:inherit;
 margin-top:6px
}

label{
 font-size:12px;
 color:#5f6b66;
 display:block;
 margin-top:11px
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}

.modal{
 position:fixed;
 inset:0;
 background:#0007;
 display:none;
 align-items:flex-end;
 z-index:10
}

.modal.show{
 display:flex
}

.sheet{
 background:var(--bg);
 width:100%;
 max-height:92vh;
 overflow:auto;
 border-radius:24px 24px 0 0;
 padding:18px
}

.sheet-head{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.x{
 border:0;
 background:#e8eeeb;
 border-radius:50%;
 width:36px;
 height:36px;
 font-size:20px
}

.preview{
 background:#fff;
 border-radius:16px;
 padding:16px;
 white-space:pre-wrap;
 border:1px solid var(--line)
}

.hidden{
 display:none!important
}

.search{
 margin:8px 0 12px
}

.measure-title{
 font-weight:700;
 margin-top:16px;
 margin-bottom:5px
}

.hint{
 font-size:11px;
 color:var(--muted);
 margin-top:4px
}

/* INVOICE PREVIEW */

.invoice{
 background:#fff;
 color:#17231f;
 border-radius:16px;
 padding:20px;
 border:1px solid #e2e7e4
}

.invoice-head{
 text-align:center;
 border-bottom:2px solid #173b2b;
 padding-bottom:14px;
 margin-bottom:14px
}

.invoice-brand{
 font-size:22px;
 font-weight:800;
 color:#173b2b
}

.invoice-sub{
 font-size:12px;
 color:#6b7772;
 margin-top:3px
}

.invoice-title{
 text-align:center;
 font-size:18px;
 font-weight:800;
 margin:10px 0 15px
}

.invoice-info{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:15px
}

.invoice-info-box{
 background:#f6f8f7;
 border-radius:10px;
 padding:9px
}

.invoice-info-box small{
 display:block;
 color:#6b7772;
 font-size:10px
}

.invoice-info-box b{
 font-size:13px
}

.invoice-table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px
}

.invoice-table th,
.invoice-table td{
 border:1px solid #dfe5e2;
 padding:8px;
 font-size:12px;
 text-align:left
}

.invoice-table th{
 background:#f0f4f2
}

.invoice-total{
 margin-top:12px;
 margin-left:auto;
 width:230px;
 max-width:100%
}

.invoice-total div{
 display:flex;
 justify-content:space-between;
 padding:5px 0;
 font-size:13px
}

.invoice-total .due{
 border-top:2px solid #173b2b;
 margin-top:4px;
 padding-top:8px;
 font-size:15px;
 font-weight:800
}

.invoice-note{
 margin-top:15px;
 background:#fafbf9;
 border-left:3px solid #c89b3c;
 padding:10px;
 font-size:12px
}

.invoice-footer{
 margin-top:22px;
 padding-top:12px;
 border-top:1px solid #e1e6e3;
 text-align:center;
 font-size:11px;
 color:#6b7772
}

@media(min-width:600px){

 .grid{
  grid-template-columns:repeat(4,1fr)
 }

 .actions{
  grid-template-columns:repeat(4,1fr)
 }

 .modal{
  align-items:center
 }

 .sheet{
  max-width:680px;
  border-radius:24px
 }
}

/* PRINT */

@media print{

 body{
  background:#fff;
  padding:0
 }

 body>*{
  display:none!important
 }

 #printArea{
  display:block!important
 }

 .invoice{
  border:0;
  border-radius:0;
  padding:10px
 }

 @page{
  size:A4;
  margin:12mm
 }
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">✂️</div>
  <div>
   <h1 id="businessName">আল-বারাকাহ টেইলার্স</h1>
   <p>Tailoring Management</p>
  </div>
 </div>
</header>

<main id="app"></main>

<nav class="bottom">

 <button class="nav active" data-tab="home">
  ⌂<br>হোম
 </button>

 <button class="nav" data-tab="orders">
  🧾<br>অর্ডার
 </button>

 <button class="nav" data-tab="customers">
  👤<br>কাস্টমার
 </button>

 <button class="nav" data-tab="more">
  ☰<br>আরও
 </button>

</nav>

<div class="modal" id="modal">
 <div class="sheet" id="sheet"></div>
</div>

<div id="printArea" class="hidden"></div>

<script>

const KEY='abt_pwa_v1';

let db=JSON.parse(
 localStorage.getItem(KEY) ||
 '{"customers":[],"orders":[],"settings":{"business":"আল-বারাকাহ টেইলার্স","phone":""}}'
);

db.customers=db.customers||[];
db.orders=db.orders||[];
db.settings=db.settings||{
 business:'আল-বারাকাহ টেইলার্স',
 phone:''
};

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const money=n=>'৳ '+Number(n||0).toLocaleString('en-BD');

const esc=s=>String(s??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);

const today=()=>new Date().toISOString().slice(0,10);

function orderNo(){

 return 'ABT-'+
 new Date().getFullYear()+
 '-'+
 String(db.orders.length+1).padStart(6,'0');

}

function modal(html){

 document.getElementById('sheet').innerHTML=html;

 document.getElementById('modal')
 .classList.add('show');

}

function closeModal(){

 document.getElementById('modal')
 .classList.remove('show');

}

document.getElementById('modal').addEventListener(
 'click',
 e=>{
  if(e.target.id==='modal')closeModal();
 }
);


/* =========================
   MEASUREMENTS
========================= */

const panjabiFields=[
 ['length','লম্বা'],
 ['shoulder','কাঁধ'],
 ['chest','বুক'],
 ['waist','কোমর'],
 ['hip','হিপ'],
 ['sleeve','হাতা'],
 ['collar','কলার'],
 ['cuff','কাফ']
];

const pajamaFields=[
 ['p_length','পায়জামা লম্বা'],
 ['p_waist','পায়জামা কোমর'],
 ['thigh','থাই'],
 ['knee','হাঁটু'],
 ['bottom','নিচ'],
 ['belt','বেল্ট']
];

function measureInputs(fields,m={}){

 return `
 <div class="form-grid">

 ${fields.map(([key,label])=>`

  <label>

   ${label}

   <input
    id="m_${key}"
    value="${esc(m[key]||'')}"
    placeholder="ইঞ্চি"
   >

  </label>

 `).join('')}

 </div>
 `;

}

function readMeasurements(){

 let m={};

 document.querySelectorAll('[id^="m_"]').forEach(x=>{
  m[x.id.slice(2)]=x.value.trim();
 });

 return m;
}

function measurementText(m={}){

 return `
পাঞ্জাবি
লম্বা: ${m.length||'—'}"
কাঁধ: ${m.shoulder||'—'}"
বুক: ${m.chest||'—'}"
কোমর: ${m.waist||'—'}"
হিপ: ${m.hip||'—'}"
হাতা: ${m.sleeve||'—'}"
কলার: ${m.collar||'—'}"
কাফ: ${m.cuff||'—'}"

পায়জামা
লম্বা: ${m.p_length||'—'}"
কোমর: ${m.p_waist||'—'}"
থাই: ${m.thigh||'—'}"
হাঁটু: ${m.knee||'—'}"
নিচ: ${m.bottom||'—'}"
বেল্ট: ${m.belt||'—'}"
`;

}

function hasPanjabi(items){

 return items.includes('Panjabi');

}

function hasPajama(items){

 return items.includes('Pajama');

}


/* =========================
   DASHBOARD
========================= */

function dashboard(){

 const todayOrders=db.orders.filter(
  o=>o.orderDate===today()
 );

 const due=db.orders.reduce(
  (a,o)=>a+Math.max(0,o.due),0
 );

 const deliveries=db.orders.filter(
  o=>o.deliveryDate===today() &&
  o.status!=='Delivered'
 );

 return `

 <div class="section-title">

  <h2>আজকের সারাংশ</h2>

  <span class="muted">
   ${today()}
  </span>

 </div>

 <div class="grid">

  <div class="card stat">
   <b>${todayOrders.length}</b>
   <span>আজকের অর্ডার</span>
  </div>

  <div class="card stat">
   <b>
    ${db.orders.filter(o=>o.status==='Sewing').length}
   </b>
   <span>সেলাই চলছে</span>
  </div>

  <div class="card stat">
   <b>${deliveries.length}</b>
   <span>আজ ডেলিভারি</span>
  </div>

  <div class="card stat">
   <b>${money(due)}</b>
   <span>মোট বাকি</span>
  </div>

 </div>

 <div class="section-title">
  <h2>দ্রুত কাজ</h2>
 </div>

 <div class="actions">

  <button class="btn gold" onclick="newOrder()">
   + নতুন অর্ডার
  </button>

  <button class="btn secondary" onclick="newCustomer()">
   + কাস্টমার
  </button>

  <button class="btn secondary" onclick="render('orders')">
   অর্ডার দেখুন
  </button>

  <button class="btn secondary" onclick="render('customers')">
   মাপ/কাস্টমার
  </button>

 </div>

 <div class="section-title">
  <h2>আজকের ডেলিভারি</h2>
 </div>

 <div class="list">

 ${
  deliveries.length
  ? deliveries.map(orderCard).join('')
  : '<div class="card muted">আজ কোনো ডেলিভারি নেই।</div>'
 }

 </div>

 `;

}


/* =========================
   ORDER CARD
========================= */

function orderCard(o){

 return `

 <div class="card">

  <div class="row">

   <div>

    <div class="order-title">
     ${esc(o.customerName)}
    </div>

    <div class="muted">
     ${esc(o.no)} ·
     ${esc((o.items||[]).join(' + '))}
    </div>

   </div>

   <span class="badge
    ${o.status==='Ready'?'warn':''}
    ${o.status==='Cancelled'?'danger':''}">

    ${esc(o.status)}

   </span>

  </div>

  <div class="row" style="margin-top:10px">

   <span class="muted">
    ডেলিভারি: ${esc(o.deliveryDate||'—')}
   </span>

   <b>
    ${money(o.due)} বাকি
   </b>

  </div>

  <div class="row" style="margin-top:10px">

   <button
    class="btn secondary"
    onclick="viewOrder('${o.id}')">

    দেখুন

   </button>

   <button
    class="btn"
    onclick="showInvoice('${o.id}')">

    🧾 Invoice

   </button>

  </div>

 </div>

 `;

}


/* =========================
   NAVIGATION
========================= */

function render(tab='home'){

 document.querySelectorAll('.nav').forEach(
  x=>x.classList.toggle(
   'active',
   x.dataset.tab===tab
  )
 );

 const app=document.getElementById('app');

 if(tab==='home'){

  app.innerHTML=dashboard();

 }

 if(tab==='orders'){

  app.innerHTML=`

  <div class="section-title">

   <h2>অর্ডার</h2>

   <button
    class="btn"
    onclick="newOrder()">
    + নতুন
   </button>

  </div>

  <input
   class="search"
   placeholder="নাম / মোবাইল / অর্ডার নম্বর সার্চ"
   oninput="filterOrders(this.value)"
  >

  <div id="orderList" class="list">

   ${
    db.orders.slice().reverse()
    .map(orderCard)
    .join('')
    ||
    '<div class="card muted">কোনো অর্ডার নেই।</div>'
   }

  </div>

  `;

 }

 if(tab==='customers'){

  app.innerHTML=`

  <div class="section-title">

   <h2>কাস্টমার</h2>

   <button
    class="btn"
    onclick="newCustomer()">
    + নতুন
   </button>

  </div>

  <input
   class="search"
   placeholder="নাম বা মোবাইল সার্চ"
   oninput="filterCustomers(this.value)"
  >

  <div id="customerList" class="list">

   ${
    db.customers.slice().reverse()
    .map(customerCard)
    .join('')
    ||
    '<div class="card muted">কোনো কাস্টমার নেই।</div>'
   }

  </div>

  `;

 }

 if(tab==='more'){

  app.innerHTML=`

  <div class="section-title">
   <h2>আরও</h2>
  </div>

  <div class="actions">

   <button
    class="btn secondary"
    onclick="reports()">
    📊 রিপোর্ট
   </button>

   <button
    class="btn secondary"
    onclick="settings()">
    ⚙️ সেটিংস
   </button>

   <button
    class="btn secondary"
    onclick="backup()">
    💾 Backup
   </button>

   <button
    class="btn secondary"
    onclick="document.getElementById('restore').click()">
    ♻️ Restore
   </button>

  </div>

  <input
   id="restore"
   type="file"
   accept=".json"
   class="hidden"
   onchange="restore(this.files[0])"
  >

  <div class="card" style="margin-top:12px">

   <b>বর্তমান ডেটা</b>

   <p class="muted">
    ${db.customers.length} কাস্টমার ·
    ${db.orders.length} অর্ডার
   </p>

  </div>

  `;

 }

}


/* =========================
   CUSTOMER
========================= */

function customerCard(c){

 let os=db.orders.filter(
  o=>o.customerId===c.id
 );

 let due=os.reduce(
  (a,o)=>a+Math.max(0,o.due),0
 );

 let saved=c.measurement &&
 Object.values(c.measurement).some(Boolean);

 return `

 <div class="card">

  <div class="row">

   <div>

    <div class="order-title">
     ${esc(c.name)}
    </div>

    <div class="muted">
     📞 ${esc(c.phone||'—')}
    </div>

   </div>

   <b>${money(due)}</b>

  </div>

  <div class="row" style="margin-top:10px">

   <span class="muted">
    ${os.length}টি অর্ডার ·
    ${saved?'📏 মাপ সংরক্ষিত':'মাপ নেই'}
   </span>

   <button
    class="btn secondary"
    onclick="viewCustomer('${c.id}')">
    প্রোফাইল
   </button>

  </div>

 </div>

 `;

}

function filterOrders(q){

 q=q.toLowerCase();

 document.getElementById('orderList').innerHTML=

 db.orders.slice().reverse()

 .filter(
  o=>
  (o.customerName+' '+o.phone+' '+o.no)
  .toLowerCase()
  .includes(q)
 )

 .map(orderCard)
 .join('')

 ||

 '<div class="card muted">মিল পাওয়া যায়নি।</div>';

}

function filterCustomers(q){

 q=q.toLowerCase();

 document.getElementById('customerList').innerHTML=

 db.customers.slice().reverse()

 .filter(
  c=>
  (c.name+' '+c.phone)
  .toLowerCase()
  .includes(q)
 )

 .map(customerCard)
 .join('')

 ||

 '<div class="card muted">মিল পাওয়া যায়নি।</div>';

}


/* =========================
   NEW CUSTOMER
========================= */

function newCustomer(){

 modal(`

 <div class="sheet-head">

  <h2>নতুন কাস্টমার</h2>

  <button
   class="x"
   onclick="closeModal()">
   ×
  </button>

 </div>

 <label>
  নাম*
  <input id="cn">
 </label>

 <label>
  মোবাইল
  <input id="cp" inputmode="tel">
 </label>

 <label>
  ঠিকানা
  <textarea id="ca"></textarea>
 </label>

 <label>
  নোট
  <textarea id="cnotes"></textarea>
 </label>

 <div class="measure-title">
  📏 স্থায়ী মাপ
 </div>

 <div class="hint">
  একবার মাপ দিলে কাস্টমারের প্রোফাইলে সংরক্ষণ হবে।
 </div>

 <div class="measure-title">
  পাঞ্জাবি
 </div>

 ${measureInputs(panjabiFields)}

 <div class="measure-title">
  পায়জামা
 </div>

 ${measureInputs(pajamaFields)}

 <button
  class="btn gold"
  style="width:100%;margin-top:15px"
  onclick="saveCustomer()">

  সেভ করুন

 </button>

 `);

}

function saveCustomer(){

 let c={

  id:crypto.randomUUID(),

  name:document.getElementById('cn')
  .value.trim(),

  phone:document.getElementById('cp')
  .value.trim(),

  address:document.getElementById('ca')
  .value,

  notes:document.getElementById('cnotes')
  .value,

  measurement:readMeasurements()

 };

 if(!c.name){

  alert('নাম দিন');
  return;

 }

 db.customers.push(c);

 save();

 closeModal();

 render('customers');

}


/* =========================
   NEW ORDER
========================= */

function customerOptions(selected=''){

 return db.customers.map(
  c=>`

  <option
   value="${c.id}"
   ${c.id===selected?'selected':''}>

function loadCustomerMeasurement(id){

 let c=db.customers.find(
  x=>x.id===id
 );

 let m=c?.measurement||{};

 [
  ...panjabiFields,
  ...pajamaFields
 ].forEach(
  ([key])=>{

   let el=document.getElementById('m_'+key);

   if(el){
    el.value=m[key]||'';
   }

  }
 );

 toggleMeasureSections();

}

function toggleMeasureSections(){

 let items=[
  ...document.getElementById('oi').selectedOptions
 ].map(x=>x.value);

 document.getElementById('panjabiBox')
 .classList.toggle(
  'hidden',
  !hasPanjabi(items)
 );

 document.getElementById('pajamaBox')
 .classList.toggle(
  'hidden',
  !hasPajama(items)
 );

}


/* =========================
   SAVE ORDER
========================= */

function saveOrder(){

 let c=db.customers.find(
  x=>x.id===document.getElementById('oc').value
 );

 if(!c){

  alert('আগে কাস্টমার নির্বাচন করুন।');
  return;

 }

 let items=[
  ...document.getElementById('oi').selectedOptions
 ].map(x=>x.value);

 if(!items.length){

  alert('কমপক্ষে একটি পোশাক নির্বাচন করুন।');
  return;

 }

 let total=
  +document.getElementById('ot').value||0;

 let paid=
  +document.getElementById('op').value||0;

 let m=readMeasurements();

 let o={

  id:crypto.randomUUID(),

  no:orderNo(),

  customerId:c.id,

  customerName:c.name,

  phone:c.phone,

  items:items,

  orderDate:document.getElementById('od').value,

  deliveryDate:document.getElementById('dd').value,

  total:total,

  paid:paid,

  due:Math.max(0,total-paid),

  status:document.getElementById('os').value,

  measurement:m,

  notes:document.getElementById('on').value,

  createdAt:new Date().toISOString()

 };

 db.orders.push(o);

 if(Object.values(m).some(Boolean)){

  c.measurement={
   ...(c.measurement||{}),
   ...m
  };

 }

 save();

 closeModal();

 render('orders');

}

async function shareText(text){

 if(navigator.share){

  try{

   await navigator.share({
    title:db.settings.business,
    text:text
   });

  }catch(e){}

 }else{

  await navigator.clipboard?.writeText(text);

  alert(
   'মেসেজ কপি করা হয়েছে। WhatsApp/Messenger-এ Paste করুন।'
  );

 }

}

function restore(file){

 let r=new FileReader();

 r.onload=()=>{

  try{

   db=JSON.parse(r.result);

   save();

   render('home');

   alert('Backup restore হয়েছে।');

  }catch(e){

   alert('Backup ফাইলটি সঠিক নয়।');

  }

 };

 r.readAsText(file);

}
